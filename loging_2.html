<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="loging_2.css">
  <title>Login Page</title>
  <!-- Add Font Awesome CDN for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>
    <form action="#" method="POST">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required placeholder="Enter your username">
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter your password">
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>
    <p class="signup-text">Don't have an account? <a href="sign_up2.html">Sign up here</a></p>
    
    <!-- Social Media Login Section -->
    <div class="social-login">
      <p>Or login with</p>
      <div class="social-icons">
        <a href="#" class="social-icon google"><i class="fab fa-google"></i> Google</a>
        <a href="#" class="social-icon facebook"><i class="fab fa-facebook-f"></i> Facebook</a>
        <a href="#" class="social-icon twitter"><i class="fab fa-twitter"></i> Twitter</a>
      </div>
    </div>
  </div>
</body>
</html>
